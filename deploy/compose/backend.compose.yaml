name: flowlesshub-backend
services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowlesshub}
      POSTGRES_USER: ${POSTGRES_USER:-flowlesshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - flowlesshub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-flowlesshub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-flowlesshub}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: 200
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${DB_PASSWORD}\" psql -h 127.0.0.1 -p 5432 -U \"$${DB_USER}\" -d \"$${DB_NAME}\" -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      args:
        APP: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flowlesshub}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-flowlesshub}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      args:
        APP: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: :5050
      APP_ENV: development
      FLOWLESSHUB_WEB_ORIGIN: ${FLOWLESSHUB_WEB_ORIGIN:-http://localhost:3000}
      FLOWLESSHUB_SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-flowlesshub}:${POSTGRES_PASSWORD:-local-only-change-me}@pgbouncer:5432/${POSTGRES_DB:-flowlesshub}?sslmode=disable
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      args:
        APP: worker
    restart: unless-stopped
    environment:
      # River uses LISTEN/NOTIFY; keep its listener on a session-capable direct
      # PostgreSQL connection instead of transaction pooling.
      DATABASE_URL: postgres://${POSTGRES_USER:-flowlesshub}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-flowlesshub}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  flowlesshub-postgres-data:
