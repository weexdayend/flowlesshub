apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowlesshub-api
  labels:
    app.kubernetes.io/name: flowlesshub-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: flowlesshub
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: flowlesshub-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowlesshub-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: flowlesshub
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: flowlesshub-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5050
              protocol: TCP
          env:
            - name: HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: flowlesshub-runtime
                  key: HTTP_ADDR
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowlesshub-runtime-secrets
                  key: DATABASE_URL_API
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
