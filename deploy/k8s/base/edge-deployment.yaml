apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowlesshub-edge
  labels:
    app.kubernetes.io/name: flowlesshub-edge
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: flowlesshub
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: flowlesshub-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowlesshub-edge
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: flowlesshub
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.11.9-alpine
          imagePullPolicy: IfNotPresent
          command: ["caddy"]
          args:
            - run
            - --config
            - /etc/caddy/Caddyfile.local
            - --adapter
            - caddyfile
          env:
            - name: FLOWLESSHUB_ACTIVE_COLOR
              value: blue
            - name: FLOWLESSHUB_SITE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: flowlesshub-edge-runtime
                  key: FLOWLESSHUB_SITE_ADDRESS
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          startupProbe:
            httpGet:
              path: /_edge/livez
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_edge/livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl --fail --silent --show-error --connect-timeout 2 --max-time 4
                  "http://flowlesshub-api-${FLOWLESSHUB_ACTIVE_COLOR}.flowlesshub.svc.cluster.local/readyz"
                  >/dev/null
                  &&
                  curl --fail --silent --show-error --connect-timeout 2 --max-time 4
                  "http://flowlesshub-web-${FLOWLESSHUB_ACTIVE_COLOR}.flowlesshub.svc.cluster.local/"
                  >/dev/null
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: edge-config
              mountPath: /etc/caddy
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: edge-config
          configMap:
            name: flowlesshub-edge-config
        - name: caddy-data
          emptyDir:
            sizeLimit: 256Mi
        - name: caddy-config
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
