apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowlesshub-worker
  labels:
    app.kubernetes.io/name: flowlesshub-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: flowlesshub
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flowlesshub-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowlesshub-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: flowlesshub
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: flowlesshub-worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowlesshub-runtime-secrets
                  key: DATABASE_URL_WORKER
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
