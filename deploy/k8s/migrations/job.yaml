apiVersion: batch/v1
kind: Job
metadata:
  name: flowlesshub-migrate
  labels:
    app.kubernetes.io/name: flowlesshub-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: flowlesshub
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  activeDeadlineSeconds: 420
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowlesshub-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: flowlesshub
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: flowlesshub-migrate:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowlesshub-runtime-secrets
                  key: DATABASE_URL_MIGRATE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
