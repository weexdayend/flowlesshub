apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: edge-deployment-tls-patch.yaml
  - path: edge-active-green-patch.yaml
  - target:
      version: v1
      kind: Service
      name: flowlesshub-edge
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports
        value:
          - name: http
            port: 80
            targetPort: http
            protocol: TCP
          - name: https
            port: 443
            targetPort: https
            protocol: TCP
