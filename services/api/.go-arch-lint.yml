version: 3
workdir: .

allow:
  depOnAnyVendor: true
  deepScan: true
  ignoreNotFoundComponents: false

components:
  kernel:
    in: internal/kernel/**
  platform:
    in: internal/platform/**
  migrations:
    in: db/migrations
  api:
    in: cmd/api
  worker:
    in: cmd/worker
  migrate:
    in: cmd/migrate

deps:
  kernel:
    mayDependOn:
      - kernel
  platform:
    mayDependOn:
      - kernel
  migrations:
    mayDependOn:
      - migrations
  api:
    mayDependOn:
      - kernel
      - platform
  worker:
    mayDependOn:
      - kernel
      - platform
  migrate:
    mayDependOn:
      - kernel
      - platform
      - migrations
