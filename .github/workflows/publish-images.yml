name: Publish FlowlessHub release images

on:
  push:
    tags:
      - "flowlesshub-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: flowlesshub-image-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=https://api.flowlesshub.com
          - image: api
            dockerfile: services/api/Dockerfile
            build_args: |
              APP=api
          - image: worker
            dockerfile: services/api/Dockerfile
            build_args: |
              APP=worker
          - image: migrate
            dockerfile: services/api/Dockerfile
            build_args: |
              APP=migrate
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push commit-addressed release images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flowlesshub-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/flowlesshub-${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=flowlesshub-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=flowlesshub-${{ matrix.image }}
          provenance: true
          sbom: true
