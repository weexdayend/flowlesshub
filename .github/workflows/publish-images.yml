name: Publish FlowlessHub release images

on:
  push:
    tags:
      - "flowlesshub-v*"

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: flowlesshub-image-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release commit and CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag must point to a commit reachable from origin/main."
            exit 1
          }

      - name: Require successful main CI for the exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          run_count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .status == "completed" and .conclusion == "success" and .head_sha == env.GITHUB_SHA)] | length')"
          if [[ "$run_count" -lt 1 ]]; then
            echo "::error::No successful push CI run found for release commit $GITHUB_SHA on main."
            exit 1
          fi
          echo "Found $run_count successful main CI run(s) for $GITHUB_SHA."

  publish:
    needs: verify-release
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=https://api.flowlesshub.com
          - image: api
            dockerfile: services/api/Dockerfile
            build_args: |
              APP=api
          - image: worker
            dockerfile: services/api/Dockerfile
            build_args: |
              APP=worker
          - image: migrate
            dockerfile: services/api/Dockerfile
            build_args: |
              APP=migrate
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push commit-addressed release images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flowlesshub-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/flowlesshub-${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=flowlesshub-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=flowlesshub-${{ matrix.image }}
          provenance: true
          sbom: true
