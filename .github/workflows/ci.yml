name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm api:generate
      - name: Verify generated API types are committed and current
        shell: bash
        run: |
          generated="packages/api-client/src/generated/openapi.d.ts"
          if ! git ls-files --error-unmatch "$generated" >/dev/null 2>&1; then
            echo "::error::Generated API types are not tracked. Run pnpm api:generate and commit $generated."
            exit 1
          fi
          if ! git diff --exit-code -- "$generated"; then
            echo "::error::Generated API types are out of date. Run pnpm api:generate and commit the result."
            exit 1
          fi
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            services/api/go.mod
            services/api/go.sum
      - name: Verify formatting
        shell: bash
        run: |
          mapfile -t go_files < <(find services/api/cmd services/api/internal -type f -name '*.go')
          if ((${#go_files[@]})); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf '%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Verify Go module metadata is tidy
        working-directory: services/api
        run: go mod tidy -diff
      - name: Verify downloaded modules
        working-directory: services/api
        run: go mod verify
      - name: Vet
        working-directory: services/api
        run: go vet ./...
      - name: Test
        working-directory: services/api
        run: go test ./...
