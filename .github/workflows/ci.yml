name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Generate API types
        run: pnpm api:generate
      - name: Verify generated API types are committed and current
        shell: bash
        run: |
          generated="packages/api-client/src/generated/openapi.d.ts"
          if ! git ls-files --error-unmatch "$generated" >/dev/null 2>&1; then
            echo "::error::Generated API types are not tracked. Run pnpm api:generate and commit $generated."
            exit 1
          fi
          if ! git diff --exit-code -- "$generated"; then
            echo "::error::Generated API types are out of date. Run pnpm api:generate and commit the result."
            exit 1
          fi
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Build frontend container image
        run: make images-web

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js for edge validation
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            services/api/go.mod
            services/api/go.sum
      - name: Generate OpenAPI Go server stubs
        run: make openapi-go
      - name: Verify generated OpenAPI Go server is committed and current
        shell: bash
        run: |
          generated="services/api/internal/platform/httpapi/openapi.gen.go"
          if ! git ls-files --error-unmatch "$generated" >/dev/null 2>&1; then
            echo "::error::Generated OpenAPI Go server is not tracked. Run make openapi-go and commit $generated."
            exit 1
          fi
          if ! git diff --exit-code -- "$generated"; then
            echo "::error::Generated OpenAPI Go server is out of date. Run make openapi-go and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- "$generated")"
          if [[ -n "$untracked" ]]; then
            echo "::error::Untracked OpenAPI Go output found:"
            printf '%s\n' "$untracked"
            exit 1
          fi
      - name: Verify Go module boundaries
        working-directory: services/api
        run: go run github.com/fe3dback/go-arch-lint@v1.19.1 check --project-path .
      - name: Lint PostgreSQL migrations with Squawk
        shell: bash
        run: |
          version="2.72.0"
          expected_sha256="a61661808119a82515565503111099b070c869f73698f61cb1785de5d0c8b11a"
          binary="$RUNNER_TEMP/squawk"
          curl -fsSL "https://github.com/sbdchd/squawk/releases/download/v${version}/squawk-linux-x64" -o "$binary"
          printf '%s  %s\n' "$expected_sha256" "$binary" | sha256sum --check
          chmod +x "$binary"
          "$binary" --pg-version=17.0 --assume-in-transaction --include=require-timeout-settings "services/api/db/migrations/*.sql"
      - name: Generate sqlc Go code
        working-directory: services/api
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f sqlc.yaml
      - name: Verify generated sqlc code is committed and current
        shell: bash
        run: |
          generated_dir="services/api/internal/platform/dbgen"
          expected_files=(db.go models.go querier.go platform.sql.go)
          for filename in "${expected_files[@]}"; do
            generated="$generated_dir/$filename"
            if ! git ls-files --error-unmatch "$generated" >/dev/null 2>&1; then
              echo "::error::Generated sqlc file is not tracked: $generated"
              echo "Run make sqlc and commit the generated output."
              exit 1
            fi
          done
          if ! git diff --exit-code -- "$generated_dir"; then
            echo "::error::Generated sqlc code is out of date. Run make sqlc and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- "$generated_dir")"
          if [[ -n "$untracked" ]]; then
            echo "::error::Untracked sqlc output found:"
            printf '%s\n' "$untracked"
            exit 1
          fi
      - name: Verify formatting
        shell: bash
        run: |
          mapfile -t go_files < <(find services/api/cmd services/api/internal -type f -name '*.go')
          if ((${#go_files[@]})); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf '%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Verify Go module metadata is tidy
        working-directory: services/api
        run: go mod tidy -diff
      - name: Verify downloaded modules
        working-directory: services/api
        run: go mod verify
      - name: Vet
        working-directory: services/api
        run: go vet ./...
      - name: Test
        working-directory: services/api
        run: go test ./...
      - name: Race detector
        working-directory: services/api
        run: go test -race ./...
      - name: Build backend container images
        run: make images-backend
      - name: Validate Kubernetes manifests
        run: make k8s-build
      - name: Validate Caddy edge configuration
        run: make edge-validate

  vps-deployment:
    name: VPS deployment config gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate VPS shell scripts
        shell: bash
        run: |
          mapfile -t vps_scripts < <(git ls-files -- 'scripts/vps/*.sh')
          if ((${#vps_scripts[@]} == 0)); then
            echo "::error::No tracked VPS shell scripts found."
            exit 1
          fi

          for script in "${vps_scripts[@]}"; do
            entry="$(git ls-files --stage -- "$script")"
            mode="${entry%% *}"
            if [[ "$mode" != "100755" ]]; then
              echo "::error::VPS shell script must be tracked as executable (100755): $script (found $mode)"
              exit 1
            fi
            if [[ ! -x "$script" ]]; then
              echo "::error::VPS shell script checkout is not executable: $script"
              exit 1
            fi
          done

          for script in scripts/vps/*.sh; do
            bash -n "$script"
          done
          shellcheck --severity=warning scripts/vps/*.sh

      - name: Prepare non-secret Compose validation fixture
        shell: bash
        run: |
          mkdir -p .vps-runtime/caddy
          cat > "$RUNNER_TEMP/flowlesshub-vps-ci.env" <<'ENV'
          FLOWLESSHUB_GHCR_OWNER=weexdayend
          FLOWLESSHUB_BLUE_RELEASE=sha-0000000000000000000000000000000000000000
          FLOWLESSHUB_GREEN_RELEASE=sha-0000000000000000000000000000000000000000
          FLOWLESSHUB_WORKER_RELEASE=sha-0000000000000000000000000000000000000000
          FLOWLESSHUB_MIGRATE_RELEASE=sha-0000000000000000000000000000000000000000
          FLOWLESSHUB_DB_NAME=flowlesshub
          FLOWLESSHUB_DB_USER=flowlesshub
          FLOWLESSHUB_DB_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FLOWLESSHUB_MIN_AVAILABLE_MIB=384
          ENV

      - name: Validate VPS Docker Compose configuration
        run: docker compose --env-file "$RUNNER_TEMP/flowlesshub-vps-ci.env" -f deploy/compose/vps.compose.yaml config --quiet

      - name: Validate both Caddy configurations
        shell: bash
        run: |
          for color in blue green; do
            docker run --rm --pull=always \
              --volume "$GITHUB_WORKSPACE/deploy/vps/Caddyfile.$color:/etc/caddy/Caddyfile:ro" \
              caddy:2.11.9-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

      - name: Validate additive Nginx virtual host configuration
        shell: bash
        run: |
          validation_dir="$RUNNER_TEMP/flowlesshub-nginx-validation"
          mkdir -p "$validation_dir/conf.d" "$validation_dir/certs"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=flowlesshub-ci.invalid' \
            -keyout "$validation_dir/certs/privkey.pem" \
            -out "$validation_dir/certs/fullchain.pem"
          sed \
            -e 's# /etc/letsencrypt/live/flowlesshub.com/fullchain.pem# /tmp/flowlesshub-certs/fullchain.pem#g' \
            -e 's# /etc/letsencrypt/live/flowlesshub.com/privkey.pem# /tmp/flowlesshub-certs/privkey.pem#g' \
            deploy/vps/nginx/flowlesshub.conf > "$validation_dir/conf.d/flowlesshub.conf"
          docker run --rm --pull=always \
            --volume "$validation_dir/conf.d:/etc/nginx/conf.d:ro" \
            --volume "$validation_dir/certs:/tmp/flowlesshub-certs:ro" \
            nginx:1.24.0-alpine nginx -t
